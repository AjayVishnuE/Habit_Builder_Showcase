<header class="site-header">
  <div class="nav-container">
    <a routerLink="/" class="brand">
      <div class="brand-mark">
        <span>D</span>
      </div>
      <span class="brand-name">DayVia</span>
    </a>
    <nav class="desktop-nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a
        routerLink="/developers"
        routerLinkActive="active">
        Developers
      </a>
      <a
        routerLink="/contact"
        routerLinkActive="active">
        Contact
      </a>
    </nav>
    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (darkMode) {
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"></path>
          </svg>
        }
      </button>
      <a
        href="https://habitsontrack.netlify.app/"
        target="_blank"
        rel="noopener"
        class="nav-app-button">
        Open App
      </a>
    </div>
  </div>
</header>
<main>
  <router-outlet></router-outlet>
</main>
<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-brand">
      <div class="footer-logo">
        D
      </div>
      <div>
        <strong>DayVia</strong>
        <span>Your way through the day.</span>
      </div>
    </div>
    <div class="footer-links">
      <a routerLink="/">Home</a>
      <a routerLink="/developers">Developers</a>
      <a routerLink="/contact">Contact</a>
    </div>
    <div class="footer-copy">
      © {{ 2026 }} DayVia
    </div>
  </div>
</footer>
